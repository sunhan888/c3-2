services:
  - type: web
    name: datamate-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_MAX_TOKENS
        value: "700"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: STORAGE_BACKEND
        value: auto
      - key: SEED_ON_STARTUP
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
